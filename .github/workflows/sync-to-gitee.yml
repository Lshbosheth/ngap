name: Sync to Gitee (HTTPS)

on:
  push:
    branches: [master]

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee via HTTPS
        run: |
          echo "=== Adding Gitee remote with token ==="
          # 格式：https://用户名:令牌@域名/用户名/仓库名.git
          git remote add gitee https://lshbosheth:${{ secrets.GITEE_TOKEN }}@gitee.com/lshbosheth/ngap.git || true
          
          echo "=== Remotes (token masked by GitHub automatically) ==="
          git remote -v | sed 's/:[^@]*@/:***@/g'  # 手动遮蔽令牌，双重保险
          
          echo "=== Pushing master branch (with 180s timeout) ==="
          timeout 180 git push gitee master --force
          PUSH_EXIT=$?
          
          if [ $PUSH_EXIT -eq 124 ]; then
            echo "❌ Push timed out after 180 seconds."
            exit 1
          elif [ $PUSH_EXIT -ne 0 ]; then
            echo "❌ Push failed with exit code $PUSH_EXIT"
            exit $PUSH_EXIT
          fi
          
          echo "=== Pushing tags (with 60s timeout) ==="
          timeout 60 git push gitee --tags --force || echo "⚠️ Tag push issue, continuing..."
          
          echo "✅ Sync to Gitee completed successfully"
